name: Build Android ARM64

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl

      - name: Pre-download NNUE File
        run: |
          curl -L -o haxorus.nnue "https://github.com/aronpetko/integral-networks/releases/download/haxorus/haxorus.nnue"

      - name: Run Jim Ablett's Android Build
        run: |
          # Add NDK toolchain binaries to PATH so Jim's Makefile can call aarch64-linux-android21-clang++
          export PATH="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          
          # Execute Jim's original two-stage Makefile build target
          make android_aarch64 EVALFILE="haxorus.nnue"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: integral_v8_ja_aarch64
          path: integral_v8_ja_aarch64
