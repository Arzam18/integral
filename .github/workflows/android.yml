name: Build Integral for Android (CMake)

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Download sse2neon Header
        run: |
          curl -sL https://raw.githubusercontent.com/DLTcollab/sse2neon/master/sse2neon.h -o sse2neon.h

      - name: Patch SIMD Headers and Memory Allocations for ARM64
        run: |
          python3 -c '
          import os

          def patch_file(path):
              with open(path, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()

              original = content

              # Replace x86 SIMD headers with sse2neon translator
              for header in ["<immintrin.h>", "<nmmintrin.h>", "<smmintrin.h>", "<xmmintrin.h>", "<emmintrin.h>", "<tmmintrin.h>", "<pmmintrin.h>", "<ammintrin.h>"]:
                  if header in content:
                      content = content.replace(header, "\"sse2neon.h\"")

              # Patch std::aligned_alloc fallback for Android NDK
              if "std::aligned_alloc" in content:
                  content = content.replace(
                      "ptr = std::aligned_alloc(Alignment, std::max(alignedBytes, Alignment));",
                      "posix_memalign(&ptr, Alignment, std::max(alignedBytes, Alignment));"
                  )

              if content != original:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(f"Patched: {path}")

          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith((".h", ".hpp", ".cpp", ".cc", ".c")):
                      patch_file(os.path.join(root, file))
          '

      - name: Configure and Build with CMake for Android ARM64
        run: |
          mkdir build
          cd build

          # Setup Android NDK toolchain variables for CMake 
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION=28 \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DCMAKE_ANDROID_NDK="$ANDROID_NDK_LATEST_HOME" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_NATIVE=OFF \
            -DBUILD_SSE41_POPCNT=ON \
            -DCMAKE_CXX_FLAGS="-march=armv8.2-a+dotprod+crypto -D__SSE4_1__ -D__POPCNT__ -static-libstdc++"

          cmake --build . --config Release -j$(nproc)

          mkdir -p ../dist/bin
          cp integral ../dist/bin/integral-android-arm64

      - name: Verify Android Binary
        run: |
          ls -lh dist/bin/
          file dist/bin/*

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: integral-android-arm64
          path: dist/bin/*

