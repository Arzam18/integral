name: Build Integral Android ARM64

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Stage 1 - Host Preprocess (Generate ARM64 NNUE)
        run: |
          mkdir -p build_host
          cd build_host
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_NATIVE=ON \
            -DPRODUCE_AARCH64_NET=ON
          make preprocess -j$(nproc)
          
          # Locates or downloads haxorus.nnue and converts layout for ARM64
          NNUE_FILE=$(ls ../*.nnue 2>/dev/null | head -n 1)
          if [ -z "$NNUE_FILE" ]; then
            NNUE_FILE="../haxorus.nnue"
          fi
          ./preprocess/preprocess "$NNUE_FILE" "processed_aarch64.nnue"

      - name: Stage 2 - Cross-Compile Engine for Android ARM64
        run: |
          mkdir -p build_android
          cd build_android
          
          NDK_TOOLCHAIN="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake"
          
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_ANDROID_AARCH64=ON \
            -DEVALFILE="$(pwd)/../build_host/processed_aarch64.nnue"
          
          make -j$(nproc)

      - name: Package Binary Artifact
        run: |
          cp build_android/integral integral_v8_ja_aarch64

      - name: Upload Android Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: integral-v8-ja-aarch64
          path: integral_v8_ja_aarch64
